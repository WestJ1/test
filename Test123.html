<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Netlify Test Site</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      background: #7dd3fc;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🚀 Netlify Test Site</h1>

    <p>
      Your free website is working successfully.
      You can now upload this file to Netlify and go live in seconds.
    </p>

    <button onclick="showMessage()">
      Click Me
    </button>

    <div class="footer">
      Hosted with Netlify
    </div>
  </div>

  <script>
    function showMessage() {
      alert("Your Netlify website is working!");
    }
  </script>

</body>
</html>
